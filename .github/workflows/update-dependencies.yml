name: Update Dependencies

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Run ksc-update
        uses: kitschpatrol/github-action-skill-to-pr@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          skill: ksc-update
          # Unreleased skill from shared-config main. Once it ships in
          # @kitschpatrol/shared-config, drop skill-source and sync skills after the install.
          skill-source: https://github.com/kitschpatrol/shared-config/tree/main/packages/shared-config/skills/ksc-update
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          model: claude-opus-5-5
          effort: high
          # Reaching the limit fails the run; num_turns in the Claude step log shows the headroom
          max-turns: 400
